<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — California Refresh Cleaning Service</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#1B5BAA" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <style>
    :root { --bg: #F8F9FB; --ink: #15243D; --ink-soft: #3F4F6B; --line: #DEE5EC; --primary: #1B5BAA; --primary-dark: #134482; --teal-soft: #DEF2EF; --accent-dark: #16847C; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 24px; background: var(--bg); color: var(--ink); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.6; text-align: center; }
    main { max-width: 560px; }
    .logo { width: 180px; height: auto; display: block; margin: 0 auto 20px; }
    .eyebrow { display: inline-block; background: var(--teal-soft); color: var(--accent-dark); padding: 6px 14px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; margin-bottom: 16px; }
    h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: clamp(1.8rem, 5vw, 2.4rem); line-height: 1.15; margin: 0 0 12px; }
    p { color: var(--ink-soft); margin: 0 0 28px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; padding: 13px 24px; border-radius: 999px; font-weight: 600; text-decoration: none; font-size: 1rem; }
    .btn-primary { background: var(--primary); color: #FFFFFF; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-ghost { color: var(--ink); border: 1.5px solid var(--line); }
    .btn-ghost:hover { border-color: var(--ink); }
    .lang { display: inline-block; margin-top: 24px; color: var(--primary-dark); font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <a href="/"><img src="/assets/logo-full.png" alt="California Refresh Cleaning Service" class="logo" width="180" height="164" /></a>
    <span class="eyebrow">Error 404</span>
    <h1>We couldn't find that page.</h1>
    <p>The link may be old or mistyped. Here are a few good places to go instead.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Go to the home page</a>
      <a href="/#contact" class="btn btn-ghost">Request a free quote</a>
    </div>
    <a href="/es/" class="lang" hreflang="es" lang="es">Ver el sitio en español</a>
  </main>
</body>
</html>
